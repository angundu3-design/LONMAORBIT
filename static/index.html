<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LONMA ORBIT</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui}
body{background:#f0f6ff}
.header{background:#0a3d9c;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header img{height:40px;width:40px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#fff}
.main{padding:14px;max-width:1100px;margin:auto}
.search-box{display:flex;gap:8px;margin:12px 0}
.search-box input{flex:1;padding:14px;border-radius:10px;border:1px solid #c5d5f0}
.btn{background:#0a3d9c;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{background:#fff;border-radius:14px;padding:14px;border:1px solid #dbe6ff}
.prod b{color:#0a3d9c}
.cart{background:#fff;border-radius:14px;padding:16px;margin-top:14px;border:1px solid #dbe6ff}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef3ff}
#reader{border-radius:14px;overflow:hidden;margin-bottom:10px}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:10px">
<img src="/static/logo.png">
<b>LONMA ORBIT</b>
</div>
<button class="btn" style="background:#fff;color:#0a3d9c" onclick="startScan()">📷 SCAN</button>
</div>

<div class="main">
<div id="reader" style="display:none"></div>
<div class="search-box">
<input id="q" placeholder="Scan or search" oninput="filter(this.value)">
<button class="btn" onclick="startScan()">Scan</button>
</div>
<div class="grid" id="products"></div>
<div class="cart">
<h3>Cart - <span id="total">KES 0</span> <span id="cnt">0</span></h3>
<div id="cart"></div>
<button class="btn" style="width:100%;margin-top:12px" onclick="checkout()">Checkout & Print</button>
</div>
</div>

<script>
const API=location.origin;
let PRODUCTS=[];
let CART=[];

async function load(){
let r=await fetch(API+"/api/products");
PRODUCTS=await r.json();
show(PRODUCTS);
}
load();

function show(list){
document.getElementById("products").innerHTML=list.map(p=>`
<div class="prod" onclick="add(${p.id})">
<b>${p.name}</b><br>
<small>${p.barcode}</small><br>
<b>KES ${p.price}</b><br>
<small>Stock ${p.stock}</small>
</div>`).join("");
}

function filter(v){
let f=PRODUCTS.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())||p.barcode.includes(v));
show(f);
let e=PRODUCTS.find(p=>p.barcode===v.trim());
if(e){add(e.id);document.getElementById("q").value="";}
}

function add(id){
let p=PRODUCTS.find(x=>x.id===id);
CART.push(p);
render();
}

function render(){
let t=0;
document.getElementById("cart").innerHTML=CART.map(c=>{t+=c.price;return `<div class="line"><span>${c.name}</span><b>${c.price}</b></div>`}).join("");
document.getElementById("total").innerText="KES "+t;
document.getElementById("cnt").innerText=CART.length;
}

function startScan(){
document.getElementById("reader").style.display="block";
let qr=new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{filter(txt);qr.stop();document.getElementById("reader").style.display="none";},()=>{});
window.qr=qr;
}

function checkout(){
if(!CART.length)return;
let total=CART.reduce((s,c)=>s+c.price,0);
let w=window.open("","_blank");
w.document.write(`<h2>LONMA ORBIT</h2>${CART.map(c=>`${c.name} KES ${c.price}<br>`).join("")}<hr>TOTAL KES ${total}<br><br>Signature _________`);
w.print();
}
</script>
</body>
</html>
