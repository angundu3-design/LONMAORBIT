<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LONMA ORBIT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:white;font-family:-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;background:#101010;min-height:100vh;padding:20px;display:flex;flex-direction:column}
.header{text-align:center;padding:20px 0 10px}
.logo-img{width:100%;max-width:340px;margin:0 auto;display:block;border-radius:12px}
.sub{color:#1bb8d4;font-size:11px;letter-spacing:4px;margin-top:10px;font-weight:600;text-align:center}
.form{margin-top:30px}
.label{font-size:11px;color:#888;font-weight:700;letter-spacing:1px;margin:18px 0 8px 4px}
.input-wrap input{width:100%;padding:16px;border-radius:14px;border:0;background:#e8edf5;color:#111;font-size:16px;outline:none}
.input-wrap input:focus{background:white;box-shadow:0 0 0 2px #1497b0}
.check{display:flex;align-items:center;gap:10px;margin:20px 0;font-size:13px;color:#aaa}
.check input{width:18px;height:18px;accent-color:#1497b0}
.check a{color:#1bb8d4}
.btn{width:100%;padding:18px;background:#1497b0;border:0;border-radius:14px;color:white;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}
.footer{text-align:center;margin-top:auto;padding-top:30px;color:#555;font-size:11px}
.footer a{color:#666}
/* SHOP */
#shop{display:none}
.shop-head{display:flex;align-items:center;gap:10px;padding:10px 0}
.shop-head img{height:40px;border-radius:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.tab{background:#1e1e1e;padding:10px 18px;border-radius:20px;white-space:nowrap;font-size:12px;font-weight:700;cursor:pointer}.tab.active{background:#1497b0;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;border-radius:16px;padding:12px;text-align:center;border:1px solid #222;position:relative}.card.sale{border:2px solid gold}
.badge{position:absolute;top:6px;left:6px;background:gold;color:black;font-size:9px;font-weight:900;padding:3px 7px;border-radius:6px}
.name{font-size:11px;font-weight:700;min-height:32px;margin-top:8px}.price{color:#1497b0;font-weight:900}.code{font-size:9px;color:#555}.comment{font-size:9px;color:#777;min-height:20px}
.btn-add{background:#1497b0;color:white;border:0;padding:9px;width:100%;border-radius:10px;font-weight:900;margin-top:6px}
#cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#1a1a1a;padding:14px;border-top:2px solid #1497b0}
#cart input{width:100%;padding:13px;border-radius:10px;border:0;margin:8px 0;background:#2a2a2a;color:white}
</style></head><body>
<div class="app" id="loginPage">
  <div class="header">
    <!-- YOUR ORIGINAL LOGO MAINTAINED -->
    <img src="/static/logo.png" class="logo-img" alt="LONMA ORBIT LOGO">
    <div class="sub">SHOP • SAVE • DELIVER</div>
  </div>
  <div class="form">
    <div class="label">USERNAME OR EMAIL</div>
    <div class="input-wrap"><input id="username" value="Mongelah" autocomplete="username"></div>
    <div class="label">PASSWORD</div>
    <div class="input-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="check"><input type="checkbox" id="terms" checked><label for="terms">I agree to <a href="#">Terms & Conditions</a></label></div>
    <button class="btn" onclick="doLogin()">LOGIN →</button>
  </div>
  <div class="footer">Website: <a href="https://app.lonmaorbit.co.ke">app.lonmaorbit.co.ke</a><br>© 2026 LONMA ORBIT</div>
</div>

<div class="app" id="shop">
  <div class="shop-head">
    <img src="/static/logo.png" alt="LO">
    <div><b>LONMA ORBIT</b><div style="font-size:9px;letter-spacing:2px;color:#1497b0">SHOP • SAVE • DELIVER</div></div>
    <div style="margin-left:auto;font-size:11px;color:#888;cursor:pointer" onclick="logout()">Logout</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid" style="padding-bottom:170px"></div>
  <div id="cart">
    <div style="display:flex;justify-content:space-between;font-weight:900;font-size:13px"><span>🛒 <span id="cnt">0</span></span><span>KES <span id="total">0</span></span></div>
    <input id="phone" placeholder="M-Pesa 07xx..." type="tel">
    <button class="btn-add" style="background:#00c853" onclick="pay()">PAY M-PESA</button>
  </div>
</div>

<script>
let PRODUCTS=[],CART=[],ACTIVE='All';
async function doLogin(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('password').value.trim();
 if(!document.getElementById('terms').checked) return alert('Agree to Terms');
 let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
 let d=await r.json();
 if(d.ok){document.getElementById('loginPage').style.display='none';document.getElementById('shop').style.display='block';loadShop();} else alert('Use Mongelah / 1234');
}
function logout(){document.getElementById('shop').style.display='none';document.getElementById('loginPage').style.display='flex';}
async function loadShop(){let r=await fetch('/api/products');PRODUCTS=await r.json();let cats=['All',...new Set(PRODUCTS.map(p=>p.cat))];document.getElementById('tabs').innerHTML=cats.map(c=>`<div class="tab ${c==ACTIVE?'active':''}" onclick="filterCat('${c}')">${c}</div>`).join('');render();}
function filterCat(c){ACTIVE=c;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.innerText==c));render();}
function render(){let list=ACTIVE=='All'?PRODUCTS:PRODUCTS.filter(p=>p.cat==ACTIVE);list=list.sort((a,b)=>{let sa=a.code&&(a.code.startsWith('FF')||a.code.startsWith('SLT')||a.code.startsWith('DTX'))?0:1;let sb=b.code&&(b.code.startsWith('FF')||b.code.startsWith('SLT')||b.code.startsWith('DTX'))?0:1;return sa-sb;});document.getElementById('grid').innerHTML=list.map(p=>{let isSale=p.code&&(p.code.startsWith('FF')||p.code.startsWith('DTX')||p.code.startsWith('SLT'));return `<div class="card ${isSale?'sale':''}">${isSale?'<div class="badge">SALE</div>':''}<div style="font-size:38px">📦</div><div class="name">${p.name}</div><div class="price">KES ${p.price}</div><div class="code">${p.code||''}</div><div class="comment">${p.comment||''}</div><button class="btn-add" onclick="addCart(${p.id})">ADD</button></div>`;}).join('');}
function addCart(id){let p=PRODUCTS.find(x=>x.id==id);let c=CART.find(x=>x.id==id);if(c)c.qty++;else CART.push({...p,qty:1});upd();}
function upd(){document.getElementById('cnt').innerText=CART.reduce((s,i)=>s+i.qty,0);document.getElementById('total').innerText=CART.reduce((s,i)=>s+i.qty*i.price,0);}
async function pay(){let phone=document.getElementById('phone').value;let amount=CART.reduce((s,i)=>s+i.qty*i.price,0);if(!phone||!CART.length)return alert('Add items + number');let r=await fetch('/api/stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount})});let data=await r.json();alert(data.msg=="DEMO MODE"?`✅ ORDER RECEIVED!\nKES ${data.amount}\nPhone: ${data.phone}`:`✅ M-Pesa sent to ${data.phone}`);}
</script>
</body></html>
