<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LONMA ORBIT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:white;font-family:-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;background:#101010;min-height:100vh;padding:20px;display:flex;flex-direction:column;position:relative}
.header{text-align:center;padding:25px 0 10px}
.logo-circle{width:120px;height:120px;border-radius:50%;margin:0 auto;display:block;object-fit:cover;box-shadow:0 0 30px rgba(20,151,176,.6);background:#1497b0}
.brand{font-weight:900;font-size:26px;letter-spacing:3px;margin-top:16px}.sub{color:#1497b0;font-size:11px;letter-spacing:4px;margin-top:6px;font-weight:600}
.form{margin-top:20px}.label{font-size:11px;color:#888;font-weight:700;letter-spacing:1px;margin:18px 0 8px 4px}
.input-wrap input{width:100%;padding:16px;border-radius:14px;border:0;background:#e8edf5;color:#111;font-size:16px;outline:none}
.btn{width:100%;padding:18px;background:#1497b0;border:0;border-radius:14px;color:white;font-weight:900;font-size:15px;cursor:pointer;margin-top:15px}
.check{display:flex;align-items:center;gap:10px;margin:20px 0;font-size:13px;color:#aaa}.check input{width:18px;height:18px;accent-color:#1497b0}.check a{color:#1497b0}
.footer{text-align:center;margin-top:auto;padding-top:30px;color:#555;font-size:11px}
#shop{display:none}.shop-head{display:flex;align-items:center;gap:10px;padding:10px 0}.shop-head img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.tab{background:#1e1e1e;padding:10px 18px;border-radius:20px;white-space:nowrap;font-size:12px;font-weight:700;cursor:pointer}.tab.active{background:#1497b0;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#1a1a1a;border-radius:16px;padding:12px;text-align:center;border:1px solid #222;position:relative}.card.sale{border:2px solid gold}.badge{position:absolute;top:6px;left:6px;background:gold;color:black;font-size:9px;font-weight:900;padding:3px 7px;border-radius:6px;z-index:2}
.name{font-size:11px;font-weight:700;min-height:32px;margin-top:8px}.price{color:#1497b0;font-weight:900}.code{font-size:9px;color:#555}.comment{font-size:9px;color:#777}
.btn-add{background:#1497b0;color:white;border:0;padding:9px;width:100%;border-radius:10px;font-weight:900;margin-top:6px}
#cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#1a1a1a;padding:14px;border-top:2px solid #1497b0;z-index:50}#cart input{width:100%;padding:13px;border-radius:10px;border:0;margin:8px 0;background:#2a2a2a;color:white}
#botBtn{position:fixed;bottom:90px;right:20px;width:60px;height:60px;background:#1497b0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;box-shadow:0 4px 15px rgba(20,151,176,.6);z-index:100;left:50%;margin-left:130px}
#botBox{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);width:90%;max-width:380px;height:400px;background:#1e1e1e;border-radius:16px;border:2px solid #1497b0;display:none;flex-direction:column;z-index:99;overflow:hidden}
.botHead{background:#1497b0;padding:12px;font-weight:900;display:flex;justify-content:space-between}
.botMsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:80%;font-size:13px}.msg.bot{background:#2a2a2a;align-self:flex-start}.msg.user{background:#1497b0;align-self:flex-end}
.botInput{display:flex;padding:10px;background:#111;gap:8px}.botInput input{flex:1;padding:12px;border-radius:20px;border:0;background:#2a2a2a;color:white}.botInput button{background:#1497b0;border:0;border-radius:50%;width:40px;height:40px;color:white;font-weight:900}
.prod-img{width:100%;height:90px;object-fit:cover;border-radius:10px;background:#222;display:block}
</style></head><body>
<div class="app" id="loginPage">
  <div class="header"><img src="/static/logo.png" class="logo-circle"><div class="brand">LONMA ORBIT</div><div class="sub">SHOP • SAVE • DELIVER</div></div>
  <div class="form"><div class="label">USERNAME OR EMAIL</div><div class="input-wrap"><input id="username" value="Mongelah"></div><div class="label">PASSWORD</div><div class="input-wrap"><input id="password" type="password" placeholder="••••••••"></div><div class="check"><input type="checkbox" id="terms" checked><label>I agree to <a href="#">Terms</a></label></div><button class="btn" onclick="doLogin()">LOGIN →</button></div>
  <div class="footer">app.lonmaorbit.co.ke • © 2026</div>
</div>
<div class="app" id="shop">
  <div class="shop-head"><img src="/static/logo.png"><div><b>LONMA ORBIT</b><div style="font-size:9px;color:#1497b0">SHOP • SAVE • DELIVER</div></div><div style="margin-left:auto;color:#888;font-size:11px" onclick="logout()">Logout</div></div>
  <div class="tabs" id="tabs"></div><div class="grid" id="grid" style="padding-bottom:170px"></div>
  <div id="cart"><div style="display:flex;justify-content:space-between;font-weight:900"><span>🛒 <span id="cnt">0</span></span><span>KES <span id="total">0</span></span></div><input id="phone" placeholder="M-Pesa 07xx..." type="tel"><button class="btn-add" style="background:#00c853" onclick="pay()">PAY M-PESA</button></div>
  <div id="botBtn" onclick="toggleBot()">🤖</div>
  <div id="botBox">
    <div class="botHead"><span>🤖 LONMA Assistant</span><span style="cursor:pointer" onclick="toggleBot()">✕</span></div>
    <div class="botMsgs" id="botMsgs"><div class="msg bot">👋 Habari! I'm LONMA Bot. Ask about products, prices, delivery!</div></div>
    <div class="botInput"><input id="botInput" placeholder="Ask me..." onkeypress="if(event.key=='Enter')sendBot()"><button onclick="sendBot()">➤</button></div>
  </div>
</div>
<script>
let PRODUCTS=[],CART=[],ACTIVE='All';
async function doLogin(){let u=username.value.trim();let p=password.value.trim();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let d=await r.json();if(d.ok){loginPage.style.display='none';shop.style.display='block';loadShop();}else alert('Mongelah / 1234');}
function logout(){shop.style.display='none';loginPage.style.display='flex';}
async function loadShop(){let r=await fetch('/api/products');PRODUCTS=await r.json();let cats=['All',...new Set(PRODUCTS.map(p=>p.cat))];tabs.innerHTML=cats.map(c=>`<div class="tab ${c==ACTIVE?'active':''}" onclick="filterCat('${c}')">${c}</div>`).join('');render();}
function filterCat(c){ACTIVE=c;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.innerText==c));render();}

// --- THIS IS THE FIXED FUNCTION - WHERE IT GOES ---
function render(){
 let list=ACTIVE=='All'?PRODUCTS:PRODUCTS.filter(p=>p.cat==ACTIVE);
 list=list.sort((a,b)=>{
  let sa=a.code&&(a.code.startsWith('FF')||a.code.startsWith('SLT')||a.code.startsWith('DTX'))?0:1;
  let sb=b.code&&(b.code.startsWith('FF')||b.code.startsWith('SLT')||b.code.startsWith('DTX'))?0:1;
  return sa-sb;
 });
 grid.innerHTML=list.map(p=>{
  let isSale=p.code&&(p.code.startsWith('FF')||p.code.startsWith('DTX')||p.code.startsWith('SLT'));
  let img = p.img || 'https://via.placeholder.com/150/1497b0/ffffff?text=LO';
  return `<div class="card ${isSale?'sale':''}">${isSale?'<div class="badge">SALE</div>':''}<img src="${img}" class="prod-img" onerror="this.src='https://via.placeholder.com/150/1497b0/ffffff?text=LO'"><div class="name">${p.name}</div><div class="price">KES ${p.price}</div><div class="code">${p.code||''}</div><div class="comment">${p.comment||''}</div><button class="btn-add" onclick="addCart(${p.id})">ADD</button></div>`;
 }).join('');
}

function addCart(id){let p=PRODUCTS.find(x=>x.id==id);let c=CART.find(x=>x.id==id);if(c)c.qty++;else CART.push({...p,qty:1});upd();}
function upd(){cnt.innerText=CART.reduce((s,i)=>s+i.qty,0);total.innerText=CART.reduce((s,i)=>s+i.qty*i.price,0);}
async function pay(){let phone=document.getElementById('phone').value;let amount=CART.reduce((s,i)=>s+i.qty*i.price,0);if(!phone||!CART.length)return alert('Add items');let r=await fetch('/api/stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount})});let d=await r.json();alert(`✅ ORDER KES ${d.amount}`);}
function toggleBot(){let b=botBox; b.style.display=b.style.display=='flex'?'none':'flex'; if(b.style.display=='flex') botInput.focus();}
async function sendBot(){let inp=botInput;let txt=inp.value.trim();if(!txt)return; botMsgs.innerHTML+=`<div class="msg user">${txt}</div>`; inp.value=''; botMsgs.scrollTop=botMsgs.scrollHeight;let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:txt})});let d=await r.json(); botMsgs.innerHTML+=`<div class="msg bot">${d.reply.replace(/\n/g,'<br>')}</div>`; botMsgs.scrollTop=botMsgs.scrollHeight;}
</script>
</body></html>
