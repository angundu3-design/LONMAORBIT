<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LONMA ORBIT</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box;margin:0;font-family:system-ui}body{background:#080a0a;min-height:100vh}.card{width:100%;max-width:420px;background:#111314;border:1px solid #1a2d2e;border-radius:28px;padding:28px 22px;margin:40px auto}.logo{width:86px;height:86px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;overflow:hidden;border:3px solid #1490a3}.logo img{width:100%;height:100%;object-fit:cover}h1{text-align:center;color:#fff;letter-spacing:4px;font-size:22px}.sub{text-align:center;color:#1490a3;letter-spacing:4px;font-size:11px;margin:6px 0 18px}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{flex:1;padding:12px;border-radius:999px;border:1px solid #222;font-weight:700;cursor:pointer}.tab-active{background:#1490a3;color:#fff}.tab-inactive{background:#151718;color:#6a6f70}input,select{width:100%;padding:14px;border-radius:12px;background:#0c0f10;border:1px solid #212525;color:#fff;margin-bottom:12px;outline:none}.btn{width:100%;padding:14px;border-radius:12px;background:#1490a3;color:#fff;border:none;font-weight:800;cursor:pointer}.hint{margin-top:16px;background:#0c0f10;border:1px dashed #2a2e2e;border-radius:12px;padding:12px;color:#8a8f90;font-size:14px}.foot{text-align:center;color:#3a4040;font-size:12px;margin-top:14px}#app{display:none;max-width:1200px;margin:auto;padding:12px}.top{background:#0e1414;padding:12px 16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;color:#fff;border:1px solid #1a2d2e;margin-bottom:12px}.grid{display:grid;grid-template-columns:260px 1fr 300px;gap:12px}.box{background:#111314;border:1px solid #1a2d2e;border-radius:16px;padding:14px;color:#fff}.prod{background:#0c0f10;border:1px solid #1f2a2a;border-radius:12px;padding:12px;cursor:pointer}.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2d2e}.navbtn{width:100%;text-align:left;padding:12px;border-radius:10px;background:#0c0f10;border:1px solid #1f2a2a;color:#8a9a9a;margin-bottom:8px;cursor:pointer}.navbtn.active{background:#1490a3;color:#fff}#botBtn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#1490a3;color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(20,144,163,.4);z-index:999}#botWin{position:fixed;bottom:90px;right:20px;width:340px;max-width:90vw;height:420px;background:#111314;border:1px solid #1a2d2e;border-radius:18px;display:none;flex-direction:column;z-index:998;overflow:hidden}#botHead{background:#1490a3;padding:14px;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:800}#botMsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}#msg{padding:10px 12px;border-radius:12px;max-width:80%;font-size:14px;line-height:20px}.user{align-self:flex-end;background:#1490a3;color:#fff}.bot{align-self:flex-start;background:#0c0f10;border:1px solid #1f2a2a;color:#c9d1d1}#botInp{display:flex;padding:10px;gap:8px;border-top:1px solid #1a2d2e}#botInp input{margin:0}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="card" id="loginCard"><div class="logo"><img src="/static/logo.png"></div><h1>LONMA ORBIT</h1><div class="sub">SIGNING & CREATING OS</div><div class="tabs"><button class="tab tab-active" id="tLogin" onclick="switchTab('login')">LOGIN</button><button class="tab tab-inactive" id="tCreate" onclick="switchTab('create')">CREATE ACCOUNT</button></div><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><input id="email" placeholder="Email" style="display:none"><div style="display:flex;align-items:center;gap:10px;color:#c9c9c9;font-size:14px;margin:6px 0 18px"><input type="checkbox" id="agree" style="width:20px;height:20px"><label>I agree to Terms</label></div><button class="btn" onclick="doLogin()" id="mainBtn">LOGIN →</button><div class="hint">👑 admin / Lonma@2026<br>💰 cashier1 / 1234<br>🏬 outlet1 / 1234</div></div><div id="app"><div class="top"><div style="display:flex;align-items:center;gap:10px"><img src="/static/logo.png" style="height:38px;width:38px;border-radius:50%;border:2px solid #1490a3;background:#fff"><b>LONMA ORBIT OS</b></div><div style="display:flex;gap:8px;align-items:center"><span id="who" style="color:#8a9a9a"></span><button onclick="logout()" style="background:#1490a3;color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer">Logout</button></div></div><div id="reader" style="display:none"></div><div class="grid"><div class="box"><button class="navbtn active" onclick="setTab('pos')" id="bPos">🛒 POS / Sell</button><button class="navbtn" onclick="setTab('products')" id="bProducts">📦 Products</button><button class="navbtn" onclick="setTab('outlets')" id="bOutlets">🏬 Outlets</button><button class="navbtn" onclick="setTab('staff')" id="bStaff">👥 Staff</button><div style="margin-top:12px"><button class="btn" onclick="startScan()">📷 SCAN BARCODE</button><input id="q" placeholder="Search barcode or name" oninput="filterQ(this.value)" style="margin-top:10px"></div><div id="outletList" style="margin-top:12px"></div></div><div class="box" id="centerBox"><h3 id="centerTitle">Products</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px" id="products"></div><div id="addProd" style="display:none;margin-top:14px"><input id="pName" placeholder="Product name"><input id="pPrice" type="number" placeholder="Price KES"><input id="pBarcode" placeholder="Barcode"><input id="pStock" type="number" placeholder="Stock"><button class="btn" onclick="saveProd()">Save Product</button></div></div><div class="box"><h3>Cart - <span id="total">KES 0</span></h3><small style="color:#7a8a9a"><span id="cnt">0</span> items</small><div id="cart" style="margin-top:10px"></div><input id="cust" placeholder="Customer name" style="margin-top:10px"><select id="pay"><option>Cash</option><option>M-Pesa</option><option>Card</option></select><button class="btn" onclick="checkout()">Checkout & Print</button><div style="margin-top:12px;background:#0c0f10;border-radius:10px;padding:10px;border:1px solid #1f2a2a"><small style="color:#7a8a9a">Today Sales</small><br><b id="todaySales">KES 0</b></div></div></div><button id="botBtn" onclick="toggleBot()">💬</button><div id="botWin"><div id="botHead"><span>🤖 LONMA Bot</span><span onclick="toggleBot()" style="cursor:pointer">✕</span></div><div id="botMsgs"><div id="msg" class="bot">Hi Mongelah! I'm LONMA AI. Ask me about stock, prices, sales, outlets.</div></div><div id="botInp"><input id="bq" placeholder="Ask something..." onkeypress="if(event.key==='Enter')askBot()"><button onclick="askBot()" style="background:#1490a3;color:#fff;border:none;padding:0 14px;border-radius:10px;font-weight:800">Send</button></div></div></div><script>let PRODUCTS=[];let CART=[];let OUTLETS=[];let TAB='pos';let mode='login';function switchTab(m){mode=m;document.getElementById('tLogin').className=m==='login'?'tab tab-active':'tab tab-inactive';document.getElementById('tCreate').className=m==='create'?'tab tab-active':'tab tab-inactive';document.getElementById('email').style.display=m==='create'?'block':'none';document.getElementById('mainBtn').innerText=m==='login'?'LOGIN →':'CREATE →';}function doLogin(){let u=document.getElementById('user').value.trim();let p=document.getElementById('pass').value.trim();if(!u||!p)return alert('Enter login');if((u==='admin'&&p==='Lonma@2026')||(u==='cashier1'&&p==='1234')||(u==='outlet1'&&p==='1234')||mode==='create'){localStorage.setItem('lo_user',u);showApp();}else alert('Use admin / Lonma@2026');}function showApp(){document.getElementById('loginCard').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').innerText=localStorage.getItem('lo_user');loadAll();}function logout(){localStorage.removeItem('lo_user');document.getElementById('app').style.display='none';document.getElementById('loginCard').style.display='block';}function setTab(t){TAB=t;document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));document.getElementById('b'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');if(t==='pos'){document.getElementById('centerTitle').innerText='Products - Tap to Add';document.getElementById('products').style.display='grid';document.getElementById('addProd').style.display='none';show(PRODUCTS);}if(t==='products'){document.getElementById('centerTitle').innerText='Manage Products';document.getElementById('products').style.display='grid';document.getElementById('addProd').style.display='block';show(PRODUCTS);}if(t==='outlets'){document.getElementById('centerTitle').innerText='Outlets';document.getElementById('products').innerHTML=OUTLETS.map(o=>`<div class="prod"><b>${o.name}</b><br><small>${o.location}</small></div>`).join('');document.getElementById('addProd').style.display='none';}if(t==='staff'){document.getElementById('centerTitle').innerText='Staff & Attendance';fetch('/api/attendance').then(r=>r.json()).then(d=>{document.getElementById('products').innerHTML=d.map(s=>`<div class="prod"><b>${s.name}</b><br><small>Days: ${s.days}</small></div>`).join('');});document.getElementById('addProd').style.display='none';}}async function loadAll(){let r1=await fetch('/api/products');PRODUCTS=await r1.json();let r2=await fetch('/api/outlets');OUTLETS=await r2.json();document.getElementById('outletList').innerHTML='<b style="color:#7a8a9a">OUTLETS</b><br><br>'+OUTLETS.map(o=>`<div style="padding:8px;background:#0c0f10;border-radius:8px;margin-bottom:6px;border:1px solid #1f2a2a"><b>${o.name}</b></div>`).join('');show(PRODUCTS);}function show(list){document.getElementById('products').innerHTML=list.map(p=>`<div class="prod" onclick="add(${p.id})"><b>${p.name}</b><br><small>${p.barcode}</small><br><b style="color:#1490a3">KES ${p.price}</b><br><small>Stock ${p.stock}</small></div>`).join('');}function filterQ(v){let f=PRODUCTS.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())||p.barcode.includes(v));show(f);let e=PRODUCTS.find(p=>p.barcode===v.trim());if(e){add(e.id);document.getElementById('q').value='';}}function add(id){let p=PRODUCTS.find(x=>x.id===id);CART.push(p);render();}function render(){let t=0;document.getElementById('cart').innerHTML=CART.map(c=>{t+=c.price;return `<div class="line"><span>${c.name}</span><b>KES ${c.price}</b></div>`}).join('');document.getElementById('total').innerText='KES '+t;document.getElementById('cnt').innerText=CART.length;document.getElementById('todaySales').innerText='KES '+t;}function saveProd(){let n=document.getElementById('pName').value;let pr=parseInt(document.getElementById('pPrice').value);let bc=document.getElementById('pBarcode').value;let st=parseInt(document.getElementById('pStock').value);if(!n||!pr)return alert('Fill');PRODUCTS.push({id:Date.now(),name:n,price:pr,barcode:bc||String(Date.now()),stock:st||0});show(PRODUCTS);}function startScan(){document.getElementById('reader').style.display='block';let qr=new Html5Qrcode('reader');qr.start({facingMode:'environment'},{fps:10,qrbox:250},(txt)=>{filterQ(txt);qr.stop();document.getElementById('reader').style.display='none';},()=>{});}function checkout(){if(!CART.length)return alert('Cart empty');let total=CART.reduce((s,c)=>s+c.price,0);let w=window.open('','_blank');w.document.write(`<center><img src="/static/logo.png" style="height:60px;width:60px;border-radius:50%"><h2>LONMA ORBIT</h2></center><small>${new Date().toLocaleString()}</small><hr>${CART.map(c=>`${c.name} - KES ${c.price}<br>`).join('')}<hr><b>TOTAL KES ${total}</b><br><br>Customer: ${document.getElementById('cust').value}<br>Pay: ${document.getElementById('pay').value}<br><br><center>--- Thank You ---</center>`);w.print();CART=[];render();}function toggleBot(){let w=document.getElementById('botWin');w.style.display=w.style.display==='flex'?'none':'flex';w.style.flexDirection='column';}function askBot(){let q=document.getElementById('bq').value.trim();if(!q)return;let msgs=document.getElementById('botMsgs');msgs.innerHTML+=`<div id="msg" class="user">${q}</div>`;let a=botAnswer(q.toLowerCase());setTimeout(()=>{msgs.innerHTML+=`<div id="msg" class="bot">${a}</div>`;msgs.scrollTop=msgs.scrollHeight;},400);document.getElementById('bq').value='';msgs.scrollTop=msgs.scrollHeight;}function botAnswer(q){let total=CART.reduce((s,c)=>s+c.price,0);if(q.includes('sale')||q.includes('total'))return `Today cart total is KES ${total} with ${CART.length} items. Today sales from outlets sync at /api/outlets.`;if(q.includes('stock'))return PRODUCTS.map(p=>`${p.name}: ${p.stock} units`).join('<br>');if(q.includes('price')||q.includes('kes'))return PRODUCTS.map(p=>`${p.name} = KES ${p.price}`).join('<br>');if(q.includes('outlet'))return OUTLETS.map(o=>`🏬 ${o.name} - ${o.location} (${o.staff} staff)`).join('<br>');if(q.includes('product'))return `We have ${PRODUCTS.length} products: `+PRODUCTS.map(p=>p.name).join(', ');if(q.includes('help'))return `I can help with:<br>• stock levels<br>• prices<br>• outlets<br>• sales total<br>• how to scan<br>Try: "show stock" or "sales total"`;if(q.includes('scan'))return `Click 📷 SCAN BARCODE button to open camera. Point at barcode. It auto-adds to cart.`;if(q.includes('receipt'))return `Receipt includes your circular LO logo automatically when you click Checkout & Print.`;return `LONMA Bot here! 🤖 I know your ${PRODUCTS.length} products and ${OUTLETS.length} outlets. Ask me "stock", "prices", "outlets", or "sales".`;}if(localStorage.getItem('lo_user'))showApp();</script></body></html>
