<div class="card" id="loginCard">
  <div class="logo"><img src="/static/logo.png"></div>
  <h1 style="text-align:center;color:#fff;letter-spacing:4px;font-size:24px">LONMA ORBIT</h1>
  <div style="text-align:center;color:#1490a3;letter-spacing:4px;font-size:11px;margin:6px 0 18px">SIGNING & CREATING OS</div>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <div style="display:flex;align-items:flex-start;gap:10px;color:#8a9a9a;font-size:13px;margin:8px 0 18px;line-height:18px">
    <input type="checkbox" id="agree" checked style="width:18px;height:18px;margin:0">
    <label for="agree">I agree to <span class="termsLink" onclick="openTerms()">Terms & Conditions</span></label>
  </div>
  <button class="btn" onclick="doLogin()">LOGIN →</button>
  <div style="margin-top:16px;text-align:center;color:#3a4040;font-size:11px">Website: <a href="https://app.lonmaorbit.co.ke" style="color:#1490a3">app.lonmaorbit.co.ke</a> • <span onclick="openTerms()" style="color:#1490a3;cursor:pointer;text-decoration:underline">Terms</span></div>
  <div style="text-align:center;margin-top:14px;font-size:11px;color:#3a4040">© 2026 LONMA ORBIT</div>
</div>
