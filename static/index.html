<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LONMA ORBIT - SHOP SAVE DELIVER</title>
<style>
*{box-sizing:border-box} body{background:#0f1115;color:white;font-family:-apple-system,sans-serif;margin:0;padding:10px;padding-bottom:180px}
.logo{background:linear-gradient(135deg,#0f8fa8,#0a6d80);border-radius:16px;padding:16px;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 4px 12px rgba(15,143,168,.3)}
.logo-icon{width:54px;height:54px;background:white;color:#0f8fa8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.logo-text{font-weight:900;font-size:22px;line-height:1}.logo-text span{font-weight:400;font-size:10px;display:block;letter-spacing:2px;opacity:.9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.tab{background:#2a2e38;padding:10px 18px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}.tab.active{background:#0f8fa8;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1d24;border-radius:16px;padding:12px;text-align:center;border:1px solid #2a2e38;position:relative;transition:.2s}
.card.sale{border:2px solid gold;box-shadow:0 0 10px rgba(255,215,0,.2)}
.badge{position:absolute;top:6px;left:6px;background:gold;color:black;font-size:9px;font-weight:900;padding:4px 7px;border-radius:6px}
.name{font-size:12px;font-weight:bold;min-height:36px;margin-top:8px;line-height:1.2}
.price{color:#0f8fa8;font-weight:900;margin:5px 0;font-size:17px}
.code{font-size:9px;color:#666;background:#111;padding:2px 5px;border-radius:4px;display:inline-block}.comment{font-size:9px;color:#aaa;min-height:24px;margin:4px 0;line-height:1.2}
.btn{background:#0f8fa8;color:#fff;border:0;padding:10px;width:100%;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}
.btn:active{transform:scale(.96)}
#cart{position:fixed;bottom:0;left:0;right:0;background:#1a1d24;padding:14px;border-top:2px solid #0f8fa8;z-index:99;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
#cart input{width:100%;padding:13px;border-radius:10px;border:0;margin:8px 0;font-size:16px;background:#2a2e38;color:white}
</style></head><body>
<div class="logo"><div class="logo-icon">LO</div><div class="logo-text">LONMA ORBIT<span>SHOP • SAVE • DELIVER</span></div></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div id="cart">
<div style="display:flex;justify-content:space-between;font-weight:900;font-size:14px"><span>🛒 Cart: <span id="cnt">0</span> items</span><span>KES <span id="total">0</span></span></div>
<input id="phone" placeholder="M-Pesa Number 07xx..." type="tel">
<button class="btn" onclick="pay()" style="background:#00c853;font-size:16px">PAY M-PESA 💳</button>
</div>
<script>
let PRODUCTS=[],CART=[],ACTIVE='All';
async function load(){
 let r=await fetch('/api/products'); PRODUCTS=await r.json();
 let cats=['All',...new Set(PRODUCTS.map(p=>p.cat))];
 document.getElementById('tabs').innerHTML=cats.map(c=>`<div class="tab ${c==ACTIVE?'active':''}" onclick="filter('${c}')">${c}</div>`).join('');
 render();
}
function filter(c){ACTIVE=c;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.innerText==c));render();}
function render(){
 let list=ACTIVE=='All'?PRODUCTS:PRODUCTS.filter(p=>p.cat==ACTIVE);
 list=list.sort((a,b)=>{let sa=a.code&&(a.code.startsWith('FF')||a.code.startsWith('SLT')||a.code.startsWith('DTX'))?0:1;let sb=b.code&&(b.code.startsWith('FF')||b.code.startsWith('SLT')||b.code.startsWith('DTX'))?0:1;return sa-sb;});
 document.getElementById('grid').innerHTML=list.map(p=>{
  let isSale=p.code&&(p.code.startsWith('FF')||p.code.startsWith('DTX')||p.code.startsWith('SLT'));
  return `<div class="card ${isSale?'sale':''}">${isSale?'<div class="badge">SALE</div>':''}
   <div style="font-size:42px">📦</div>
   <div class="name">${p.name}</div>
   <div class="price">KES ${p.price}</div>
   <div class="code">${p.code||''}</div>
   <div class="comment">${p.comment||''}</div>
   <button class="btn" onclick="add(${p.id})">ADD TO CART</button>
  </div>`;
 }).join('');
}
function add(id){let p=PRODUCTS.find(x=>x.id==id);let c=CART.find(x=>x.id==id);if(c)c.qty++;else CART.push({...p,qty:1});update();}
function update(){document.getElementById('cnt').innerText=CART.reduce((s,i)=>s+i.qty,0);document.getElementById('total').innerText=CART.reduce((s,i)=>s+i.qty*i.price,0);}
async function pay(){
 let phone=document.getElementById('phone').value;
 let amount=CART.reduce((s,i)=>s+i.qty*i.price,0);
 if(!phone||!CART.length)return alert('Add items + enter M-Pesa number');
 let r=await fetch('/api/stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount})});
 let data=await r.json();
 if(data.msg=="DEMO MODE"){
   alert(`✅ ORDER RECEIVED!\n\nAmount: KES ${data.amount}\nPhone: ${data.phone}\n\nIn DEMO mode - Add M-Pesa keys in Render to go LIVE.\nYour order: ${CART.map(i=>i.name+' x'+i.qty).join(', ')}`);
 } else {
   alert(`✅ M-Pesa Prompt Sent to ${data.phone}!\nCheck your phone & enter PIN`);
 }
}
load();
</script>
</body></html>
